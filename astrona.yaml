      - type: lab
        title: "Fix Findings And Record An Exception Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: security-automation
        task_kind: fix
        tags: [trivy, misconfiguration-scan, finding, security-context, privileged, exception, ignore-file, evidence]
        learning_goals:
          - Remove a privileged setting and harden a Deployment, and prove the change on the running pods
          - Record a scoped, explained and dated exception for a finding that cannot be fixed
          - Keep the workloads available while the findings are closed
        resources:
          - name: "Trivy Kubernetes misconfiguration scanning"
            url: https://trivy.dev/latest/docs/coverage/iac/kubernetes/
          - name: "Trivy filtering and ignore files"
