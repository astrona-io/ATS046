        difficulty: intermediate
        estimated_duration: 25m
        topic: policy-enforcement
        task_kind: build
        tags: [kyverno, clusterpolicy, validatingadmissionpolicy, cel, audit, enforce, policyreport]
        learning_goals:
          - Switch a Kyverno policy from Audit to Enforce and prove the rejection with a server-side dry run
          - Read a policy report and tell a failed Pod result from an old ReplicaSet result
          - Write a ValidatingAdmissionPolicy with a Deny binding limited to one namespace
        resources:
          - name: "Kyverno validate rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/validate/
