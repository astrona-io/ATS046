# A plain-HTTP container registry inside the cluster. The Service has a fixed
# cluster IP so the node's container runtime can be pointed at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: supply-chain
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: supply-chain
spec:
  clusterIP: 10.96.0.50
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
