# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Signing And Verifying Images (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-046-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - alpine:3.22.2
      - registry:2.8.3

bootstrap:
  init:
    - name: seed-cluster
      description: "Install Kyverno 1.19.1, the toolbox pod and the registry, then copy three images into it"
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-policy
      description: Wait until Kyverno enforces the policy
      type: file
      source: testing/wait-for-policy.sh

validation:
  scripts:
    - name: scout-signature-verifies
      description: The scout image digest in the registry has a signature that verifies with the generated key pair
      type: file
      source: validation/validate-scout-signature-verifies.sh
      hint: Generate the key pair in /work/keys. Sign the digest with cosign sign --key, --tlog-upload=false, --allow-insecure-registry and --allow-http-registry.
    - name: unsigned-image-rejected
      description: A pod with an unsigned image from the lab registry is rejected by require-signed-images
      type: file
      source: validation/validate-unsigned-image-rejected.sh
      hint: Use a ClusterPolicy named require-signed-images with a verifyImages entry whose failureAction is Enforce.
    - name: foreign-key-rejected
      description: An image signed with a different key is rejected
      type: file
      source: validation/validate-foreign-key-rejected.sh
      hint: Put the public key from /work/keys/cosign.pub into attestors.entries.keys.publicKeys. A signature from any other key must not pass.
    - name: signed-image-admitted
      description: The signed scout image is admitted by digest and by tag
      type: file
      source: validation/validate-signed-image-admitted.sh
      hint: Set rekor.ignoreTlog to true, because the signature was made with --tlog-upload=false.
    - name: other-registries-unaffected
      description: Images from other registries are still admitted
      type: file
      source: validation/validate-other-registries-unaffected.sh
      hint: Limit imageReferences to the lab registry, registry.supply-chain.svc.cluster.local:5000/*, and not to *.

teardown:
  keepCluster: false
