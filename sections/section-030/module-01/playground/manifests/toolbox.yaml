# The supply chain toolbox: one pod with cosign and Trivy (installed by the
# bootstrap script) and a working directory for keys, SBOMs and reports.
apiVersion: v1
kind: Namespace
metadata:
  name: supply-chain
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: supply-chain
  labels:
    app: toolbox
spec:
  containers:
    - name: toolbox
      image: alpine:3.22.2
      command: ["sleep", "infinity"]
      workingDir: /work
      env:
        # Lab-only password for the cosign private key. Never use this in production.
        - name: COSIGN_PASSWORD
          value: starfleet-lab
        - name: REGISTRY
          value: registry.supply-chain.svc.cluster.local:5000
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
