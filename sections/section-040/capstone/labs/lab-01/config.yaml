# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Automation and Tooling capstone: the continuous compliance loop (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-046-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - ghcr.io/aquasecurity/trivy:0.76.1

# Starting state: Kyverno 1.19.1 with its webhooks ready, the Starfleet
# workloads (probe privileged, scout with a hand-made hostNetwork drift,
# shuttle that writes to its root file system), a Trivy toolbox, an empty
# exception register and the approved scout manifest. No policy exists.
bootstrap:
  init:
    - name: seed-cluster
      description: Install Kyverno 1.19.1, create the workloads, the Trivy toolbox, the register and the approved manifest
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-enforcement
      description: Wait until the policies reject bad requests
      type: file
      source: testing/wait-for-enforcement.sh

validation:
  scripts:
    - name: probe-not-privileged
      description: probe runs no privileged container and is available
      type: file
      source: validation/validate-probe-not-privileged.sh
      hint: Run a Trivy scan, find KSV-0017 on probe and set privileged to false. The running pod must be replaced, so check the new pod and not only the Deployment.
    - name: scout-drift-repaired
      description: scout matches the approved manifest and no pod uses the host network
      type: file
      source: validation/validate-scout-not-hostnetwork.sh
      hint: Compare the live scout Deployment with the approved manifest in the ConfigMap approved-manifests (kubectl diff -f). Remove hostNetwork and wait for the rollout.
    - name: privileged-enforced
      description: Kyverno rejects privileged pods and Deployments in starfleet only
      type: file
      source: validation/validate-privileged-enforced.sh
      hint: Create a Kyverno ClusterPolicy with failureAction Enforce that matches Pod in starfleet and requires privileged to be false or absent. Audit mode does not reject. Do not match outpost.
    - name: hostnetwork-denied
      description: A ValidatingAdmissionPolicy denies hostNetwork Deployments in starfleet only
      type: file
      source: validation/validate-hostnetwork-denied.sh
      hint: Write a ValidatingAdmissionPolicy that reads object.spec.template.spec.hostNetwork, and a binding with validationActions Deny and a namespaceSelector on kubernetes.io/metadata.name=starfleet. A policy without a binding does nothing.
    - name: services-still-answer
      description: shuttle still gets answers from scout and probe
      type: file
      source: validation/validate-services-answer.sh
      hint: A fix that leaves a pod in CrashLoopBackOff breaks the Service. Check the new pods with kubectl get pods.
    - name: shuttle-not-changed
      description: shuttle was not made read-only to clear the finding, and still runs
      type: file
      source: validation/validate-shuttle-unchanged.sh
      hint: shuttle must keep a writable root file system, because it writes /tmp/last-run. Record an exception instead.
    - name: exception-recorded
      description: The register holds one dated, scoped and explained exception for KSV-0014 on shuttle
      type: file
      source: validation/validate-exception-recorded.sh
      hint: In the trivy-exceptions ConfigMap, key trivyignore.yaml, write one entry under misconfigurations with id KSV-0014, a paths list that names shuttle, a one-line statement and an expired_at date (yyyy-mm-dd) that is in the future and within 90 days.

teardown:
  keepCluster: false
