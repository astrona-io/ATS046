# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Automation, Findings And Control Drift (PLAYGROUND) - playground environment.
# A clean sandbox: it starts, applies the Starfleet workloads and a Trivy
# toolbox, then stays running for free exploration. No task, no grading, no
# `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-046-playground-040-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - ghcr.io/aquasecurity/trivy:0.76.1

# What the learner starts with: `scout` with no securityContext, `probe` with a
# privileged container, `shuttle` that writes to its root file system, and a
# Trivy 0.76.1 toolbox pod in `tools` with an empty exception register.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost
    - resource: deploy/trivy
      namespace: tools

teardown:
  keepCluster: false
