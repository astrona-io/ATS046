# Access starting state. The shuttle service account can read Secrets in
# starfleet through a Role. This grant is deliberate: it is one step of the
# attack path the reader breaks.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shuttle-secret-reader
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shuttle-secret-reader
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: shuttle
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shuttle-secret-reader
