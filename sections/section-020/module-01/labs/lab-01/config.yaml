# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Turn STRIDE Threats Into Mitigations (LAB). Graded against the live cluster.
# UNTESTED: built without running it. Validated statically only.
apiVersion: astrona.io/v1
metadata:
  name: ats-046-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, a scout service account bound to
# the edit ClusterRole, a privileged probe and a probe that accepts traffic
# from every pod. The faults are left in place on purpose. kind's default
# network plugin (kindnet) enforces NetworkPolicy.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty setup
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-policy
      description: Wait until the network plugin enforces the probe policy
      type: file
      source: testing/wait-for-policy.sh

validation:
  scripts:
    - name: scout-least-privilege
      description: scout reads its own ConfigMap and nothing else
      type: file
      source: validation/validate-scout-least-privilege.sh
      hint: Find the RoleBinding that gives scout the edit ClusterRole and delete it. Add a Role with get on the ConfigMap scout-config and bind it to scout. Keep the service account.
    - name: probe-accepts-only-shuttle
      description: Only shuttle reaches probe
      type: file
      source: validation/validate-probe-accepts-only-shuttle.sh
      hint: Add a NetworkPolicy in starfleet that selects the probe pods and allows ingress only from pods labelled app=shuttle on the container port of probe. A policy that allows the whole namespace still lets caller in.
    - name: probe-hardened
      description: probe runs unprivileged as a non-root user
      type: file
      source: validation/validate-probe-hardened.sh
      hint: Edit the probe container securityContext. Remove privileged, set runAsNonRoot true with a numeric runAsUser, allowPrivilegeEscalation false and drop ALL capabilities. Wait for the new pod to roll out.
    - name: app-still-works
      description: The application still works
      type: file
      source: validation/validate-app-still-works.sh
      hint: Do not delete or scale down workloads, the ConfigMap or the Secret. shuttle must still reach scout.

teardown:
  keepCluster: false
