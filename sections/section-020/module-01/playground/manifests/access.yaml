# Access starting state. The scout service account is bound to the built-in
# edit ClusterRole in starfleet. This over-broad grant is deliberate: it is an
# elevation-of-privilege threat the reader finds and removes.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scout-edit
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: scout
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
