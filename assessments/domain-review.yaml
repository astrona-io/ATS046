  title: Compliance and Security Frameworks
placement:
  position: after
  reading: sections/section-040/module-01/course-02-summary.md
questions:
- id: ats046-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify why compliance evidence does not prove absence of risk.
  source_readings:
  - sections/section-010/module-01/course-01-frameworks-scope-and-demonstrable-controls.md
  prompt: A compliance result is green. Which continuing activity remains relevant?
  options:
  - id: a
    text: All user permission checks can be removed.
    explanation: Compliance does not replace business authorization.
  - id: b
    text: Threat review, changed configuration and vulnerability response.
    explanation: Assessment evidence is bounded in scope and time.
  - id: c
    text: No future maintenance is necessary.
    explanation: Systems and knowledge change.
  correct_option: b
  explanation: Assessment evidence is bounded in scope and time.
- id: ats046-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate proposed mitigations to specific trust-boundary failures.
  source_readings:
  - sections/section-020/module-01/course-01-using-a-framework-to-ask-better-security-questions.md
  prompt: A mitigation is proposed without naming a failure path or asset. What should be clarified?
  options:
  - id: a
    text: The threat it addresses, enforced boundary and residual risk.
    explanation: A control needs a concrete purpose and limit.
  - id: b
    text: Only the product's popularity.
    explanation: Popularity does not connect protection to the architecture.
  - id: c
    text: Assume every product fixes every STRIDE category.
    explanation: Tools have specific capabilities and coverage.
  correct_option: a
  explanation: A control needs a concrete purpose and limit.
- id: ats046-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the limits of framework levels and attestations.
  source_readings:
  - sections/section-030/module-01/course-01-demonstrating-what-was-built-and-deployed.md
  prompt: A verification service allows releases during an outage despite a strict written policy. What
    should the assurance record capture?
  options:
  - id: a
    text: Only the policy's preferred wording.
    explanation: The observed acceptance path is relevant evidence.
  - id: b
    text: A guarantee that all admitted artifacts are harmless.
    explanation: Missing checks do not prove safe content.
  - id: c
    text: The actual failure behavior and decisions during that interval.
    explanation: Effective operation can differ from written intent.
  correct_option: c
  explanation: Effective operation can differ from written intent.
- id: ats046-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Interpret findings through scope, version and effective behavior.
  source_readings:
  - sections/section-040/module-01/course-01-what-security-automation-can-establish.md
  prompt: A rule set from another platform version reports a deviation. What is needed before treating
    it as confirmed risk?
  options:
  - id: a
    text: Assume version context never matters.
    explanation: Configuration meaning and supported controls can change.
  - id: b
    text: Validate target version, rule scope and effective behavior.
    explanation: Findings require context and accurate interpretation.
  - id: c
    text: Automatically grant every workload broader permissions.
    explanation: That does not establish or repair the claimed issue.
  correct_option: b
  explanation: Findings require context and accurate interpretation.
- id: ats046-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate exception review and evidence retention to continuous assurance.
  source_readings:
  - sections/section-040/module-01/course-01-what-security-automation-can-establish.md
  prompt: A retained report lacks target identity, observation time and rule version. What is its weakness?
  options:
  - id: a
    text: It cannot clearly demonstrate which environment and requirement were assessed.
    explanation: Evidence needs enough context to interpret its scope.
  - id: b
    text: It is automatically stronger because it is shorter.
    explanation: Brevity does not establish traceability.
  - id: c
    text: It proves every future environment is compliant.
    explanation: An unidentified historical result cannot make that claim.
  correct_option: a
  explanation: Evidence needs enough context to interpret its scope.
